[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-emulation"
version = "0.0.4.0"
description = "Python port of TrialEmulation R package for causal analysis of observational time-to-event data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Xander Vermeulen", email = "Xander.Vermeulen@mwdh.co.uk"},
    {name = "Chris Sainsbury", email = "chris.sainsbury@mwdh.co.uk"},
]
maintainers = [
    {name = "Xander Vermeulen", email = "Xander.Vermeulen@mwdh.co.uk"},
]
keywords = ["causal inference", "trial emulation", "marginal structural models", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "statsmodels>=0.13.0",
    "scipy>=1.7.0",
    "pybind11>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/csainsbury/Trial-Emulation-R2P"
Documentation = "https://trial-emulation.readthedocs.io"
Repository = "https://github.com/csainsbury/Trial-Emulation-R2P"
Issues = "https://github.com/csainsbury/Trial-Emulation-R2P/issues"
Changelog = "https://github.com/csainsbury/Trial-Emulation-R2P/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["trial_emulation"]

[tool.setuptools.package-data]
trial_emulation = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--cov=trial_emulation",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "cpp: marks tests that require C++ extension",
]

[tool.coverage.run]
source = ["trial_emulation"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 25
precision = 2

